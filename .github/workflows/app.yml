# Session Board's window app (app/): tested on every OS on each push, and on a version tag built
# for macOS, Windows and Linux and attached to that tag's release with its checksums. app/release.json,
# which the plugin checks each download against, is then filled in from SHA256SUMS.
name: Window app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libxcb1-dev
      - run: node --test ui/model.test.mjs ui/shortcut.test.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: Session-Board-macos.tar.gz
          - os: windows-latest
            asset: session-board.exe
          - os: ubuntu-22.04
            asset: Session-Board-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libxcb1-dev file
      - run: npm ci
      - name: "Build (macOS, one app for Apple Silicon and Intel, signed ad hoc)"
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npx tauri build --target universal-apple-darwin --bundles app
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Session Board.app"
          codesign --force --deep -s - "$APP"
          tar -czf "../${{ matrix.asset }}" -C "$(dirname "$APP")" "Session Board.app"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          npx tauri build --no-bundle
          cp src-tauri/target/release/session-board.exe "../${{ matrix.asset }}"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          npx tauri build --bundles appimage
          cp src-tauri/target/release/bundle/appimage/*.AppImage "../${{ matrix.asset }}"
      - name: Attach to the release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Session Board $GITHUB_REF_NAME" || true
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber
