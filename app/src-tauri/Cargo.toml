[package]
name = "session-board"
version = "0.3.7"
description = "Session Board: every Claude Code session on this computer, in one window"
authors = ["Kiran Pothana"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-opener = "=2.6.0"
tauri-plugin-single-instance = "=2.5.0"
serde = { version = "1", features = ["derive"] }
active-win-pos-rs = "=0.11.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
serde_json = "1"
base64 = "=0.22.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# On macOS the windows are put on screen without activating the app, as the SwiftUI panel did
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.0"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent", "NSResponder", "block2"] }
block2 = "=0.6.2"
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "libc", "AXUIElement", "AXError", "HIServices", "AXAttributeConstants", "AXRoleConstants"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFString", "CFArray", "CFBase", "CFNumber", "CFDictionary"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Dwm"] }

